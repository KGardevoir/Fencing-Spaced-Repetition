# Publishes the browser build to GitHub Pages.
#
# Pages is a fit here for a reason worth recording: it serves static files and
# sets no headers of its own, so it cannot send COOP/COEP and a page it serves
# is never cross-origin isolated. That rules out SharedArrayBuffer, and so
# rules out SQLite's OpfsDb VFS -- but the vendored worker uses the SAH-pool
# VFS, which needs neither. See third_party/sqlite-web-worker.
#
# Everything the bundle loads is addressed relatively -- the script tag, and
# the SQLite worker through import.meta.url -- so serving from a project
# subpath (user.github.io/repo/) needs no base href and no rewriting.
name: Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

# One deployment at a time, and never cancel one midway: a half-replaced
# bundle is a page whose JavaScript and wasm disagree about their own version.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Web Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      # Pages runs Jekyll over the upload unless told not to, and Jekyll drops
      # files and directories beginning with an underscore. Webpack is entitled
      # to emit those, and the failure would be a 404 for one chunk rather than
      # anything that looks like a build problem.
      - name: Disable Jekyll processing
        run: touch web/build/dist/wasmJs/productionExecutable/.nojekyll

      - name: Show what is being published
        run: ls -lh web/build/dist/wasmJs/productionExecutable/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
