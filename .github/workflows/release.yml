name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/release-keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Build release AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute artifact names and rename files
        id: artifact
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          VERSION=${{ steps.tag.outputs.tag }}
          SHORT_SHA=${GITHUB_SHA::7}
          APK_NAME="AnkiFlex-${TIMESTAMP}-${VERSION}-${SHORT_SHA}.apk"
          AAB_NAME="AnkiFlex-${TIMESTAMP}-${VERSION}-${SHORT_SHA}.aab"
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/${APK_NAME}
          mv app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/${AAB_NAME}
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_name=${AAB_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_path=app/build/outputs/apk/release/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_path=app/build/outputs/bundle/release/${AAB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v6
        with:
          path: ${{ steps.artifact.outputs.apk_path }}
          archive: false
          retention-days: 90

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v6
        with:
          path: ${{ steps.artifact.outputs.aab_path }}
          archive: false
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.artifact.outputs.aab_path }}
