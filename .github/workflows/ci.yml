name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # TEMPORARY: this environment cannot reach Google's Maven, so the exact
      # class names inside androidx.sqlite / room3 cannot be checked locally.
      # This prints them once so the driver import can be confirmed rather
      # than guessed. Remove once Room 3 builds.
      - name: Inspect androidx sqlite/room3 classes (temporary)
        continue-on-error: true
        run: |
          # :app:dependencies resolves metadata only -- it does not download the
          # jars, so the previous run dumped sqlite (already in the restored
          # cache) and nothing at all for room3. Force the real download first.
          ./gradlew :app:kspDebugKotlin || true
          echo "===== class names ====="
          mkdir -p /tmp/inspect
          find ~/.gradle/caches/modules-2/files-2.1                \( -path "*androidx.sqlite*" -o -path "*androidx.room3*" \)                \( -name "*.jar" -o -name "*.aar" \) | while read -r f; do
            rm -rf /tmp/inspect/x && mkdir -p /tmp/inspect/x
            unzip -qo "$f" -d /tmp/inspect/x 2>/dev/null || continue
            if [ -f /tmp/inspect/x/classes.jar ]; then
              unzip -qo /tmp/inspect/x/classes.jar -d /tmp/inspect/x/c 2>/dev/null || true
            fi
            found=$(find /tmp/inspect/x -name "*.class"               | sed 's|.*/x/c/||; s|.*/x/||; s|\.class$||; s|/|.|g'               | grep -E "^androidx\.(sqlite|room3)\." \
              | grep -vE '\$' | sort -u)
            if [ -n "$found" ]; then echo "--- $(basename "$f")"; echo "$found" | head -60; fi
          done

      - name: Run unit tests
        run: ./gradlew :shared:allTests :app:testDebugUnitTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            shared/build/reports/tests/
          retention-days: 14

  web:
    name: Build Web Bundle
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      - name: List bundle contents
        run: ls -lh web/build/dist/wasmJs/productionExecutable/

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web/build/dist/wasmJs/productionExecutable/
          retention-days: 14

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > ${{ runner.temp }}/debug-keystore.jks
          keytool -list -keystore ${{ runner.temp }}/debug-keystore.jks -storepass android -storetype JKS 2>/dev/null \
            || keytool -list -keystore ${{ runner.temp }}/debug-keystore.jks -storepass android 2>/dev/null \
            || echo "WARNING: could not list keystore entries"
          # Verify the key password works before handing off to Gradle
          KEY_ALIAS="${{ secrets.DEBUG_KEY_ALIAS }}"
          KEY_PASS="${{ secrets.DEBUG_KEY_PASSWORD }}"
          keytool -exportcert -keystore ${{ runner.temp }}/debug-keystore.jks \
            -storepass android -alias "${KEY_ALIAS:-androiddebugkey}" \
            -keypass "${KEY_PASS:-android}" > /dev/null \
            && echo "Key password verified OK" \
            || echo "WARNING: key password check failed"

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/debug-keystore.jks
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-schemas
          path: app/schemas/
          retention-days: 14

      - name: Rename debug APK
        id: artifact
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          SHORT_SHA=${GITHUB_SHA::7}
          APK_NAME="AnkiFlex-${TIMESTAMP}-debug-${SHORT_SHA}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/${APK_NAME}
          echo "apk_path=app/build/outputs/apk/debug/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.apk_path }}
          archive: false
          retention-days: 14
