# Fencing Spaced Repetition -- a starter deck.
#
# The smallest export the app will read: a list of cards, each with a
# question and an answer. A full export carries a good deal more --
# groups, learning states, images, review history -- and is documented in
# example_export.yaml.
#
# Import it as it is, or gzip it first; the app reads both.

version: 5
cards:
  - question: Fleche
    answer: An explosive running attack where the back foot crosses in front of the front foot. Used in epee and foil as a surprise long-distance attack.
  - question: Balestra
    answer: A short jump forward followed immediately by a lunge. Combines footwork with an attack to close distance quickly.
  - question: Beat Attack
    answer: "A sharp tap on the opponent's blade to deflect it before attacking. Creates an opening by displacing the opposing blade."
  - question: Disengage
    answer: "Moving the blade from one line to another, typically around the opponent's blade. A fundamental offensive blade action."
  - question: Coupe
    answer: "A disengagement made by passing the blade over the opponent's point. Useful when the opponent searches for the blade."
  - question: Parry 4
    answer: "Blade moves from outside to inside, protecting the inside high line (chest). One of the most common defensive actions."
  - question: Parry 6
    answer: "Blade moves from inside to outside, protecting the outside high line (flank). Often paired with parry 4."
  - question: Parry 7
    answer: "Blade sweeps down, protecting the low inside line. Used against attacks to the low line."
  - question: Parry 8
    answer: "Blade sweeps down, protecting the low outside line. Less common but effective against certain low attacks."
  - question: Riposte
    answer: A counter-attack made immediately after a successful parry. The most direct way to score after defending.
  - question: Counter-Riposte
    answer: "An attack made after parrying the opponent's riposte. Extends the phrase d'armes after the initial exchange."
  - question: Priority (Right of Way)
    answer: "In foil and sabre, the fencer who initiates an attack first has priority. The attacking fencer's touch counts if both hit simultaneously."
  - question: Corps-a-corps
    answer: "Body contact between fencers, which halts the action. Results in a halt and restart of the bout."
  - question: Point in Line
    answer: "An extended arm with point threatening, which has priority if established before an attack. Must be dealt with before attacking."
  - question: Remise
    answer: A renewal of an attack in the same line without withdrawing the arm. An immediate continuation after the initial attack fails.
  - question: Redoublement
    answer: A new attack made after returning to en garde following an initial attack. A second complete offensive action.
  - question: Compound Attack
    answer: An attack with one or more feints before the final action. Uses deception to draw parries and create openings.
  - question: Appel
    answer: A sharp stamp of the front foot to startle or distract the opponent. A preparation that can provoke a reaction.
  - question: Passata Sotto
    answer: "A low evasive action where the fencer drops under the opponent's blade. A dramatic defensive-offensive movement."
  - question: Prise de Fer
    answer: "Taking the opponent's blade and maintaining contact while attacking. Includes bind, croise, envelopment, and opposition."
  - question: In Quartata
    answer: A counter-attack made while rotating the body away from the attack. Combines evasion with an attack in one motion.
  - question: Absence of Blade
    answer: "Keeping the blade away from the opponent's to avoid engagement. A tactical choice to prevent the opponent from taking the blade."
  - question: Second Intention
    answer: "An attack designed to draw a response, followed by the real attack. A tactical setup that exploits the opponent's reaction."
  - question: Ceding Parry
    answer: "Yielding to the opponent's pressure while redirecting their blade. Uses the opponent's force against them."
  - question: Sentiment du Fer
    answer: "The feeling or sense of the opponent's blade through contact. Developed through experience, allows reading the opponent's intentions through blade pressure."
  - question: Advance-Lunge
    answer: A step forward followed by a lunge. Extends the attack range beyond a simple lunge.
  - question: Retreat-Parry-Riposte
    answer: "Step back while parrying, then deliver a riposte. Creates distance for defense before countering."
  - question: Feint
    answer: A false attack intended to draw a defensive reaction. Opens a line for the real attack.
  - question: Engagement
    answer: "Making blade contact with the opponent's blade. Establishes control and can provoke reactions."
  - question: Change of Engagement
    answer: "Moving from one line of engagement to another. Tests the opponent's reactions and creates uncertainty."
  - question: Preparation
    answer: "Actions taken before launching an attack -- footwork, feints, beats, or changes of engagement. Sets up the conditions for a successful attack."
  - question: Line
    answer: "The path along which the blade travels during an attack or defense. Understanding lines (high/low, inside/outside) is fundamental to fencing tactics."
  - question: En Garde
    answer: "The basic ready position. Balanced stance with the weapon arm extended, knees bent, weight centered. The starting point for all actions."
  - question: Lunge
    answer: "The primary attacking movement. Extend the weapon arm, then push off the back leg while the front foot lands heel first."
  - question: Recovery
    answer: Returning to en garde after a lunge or other action. Can be forward (continuing the attack) or backward (returning to defense).
