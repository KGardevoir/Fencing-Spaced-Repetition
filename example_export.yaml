# Fencing Spaced Repetition -- the export format, by example.
#
# An export is a YAML document. The app writes it gzipped, as
# "<timestamp>_<what-it-holds>.yaml.gz", and reads it either gzipped or
# plain -- which of the two is worked out from the file's first two bytes,
# not from its name.
#
# This file is itself a valid export: it will import, and the cards below
# will appear. Everything after a "#" is a comment and is ignored.
#
# The tab-separated format earlier versions wrote (files beginning with
# "#FSR_EXPORT_V1" through "#FSR_EXPORT_V4") still imports. Nothing writes
# one any more.

version: 5

# ---------------------------------------------------------------------------
# groups -- only those with a setting of their own. A group that just holds
# cards needs no entry here; it is created from the cards that name it.
# Every setting is optional, and one left out means "use the app's default".
# ---------------------------------------------------------------------------
groups:
  - name: Blade Actions
    cardsPerSession: 20
    autoShowAnswer: false
    randomizeDueCards: true
    randomizeBucketHours: 6
    practiceDays: "1,3,5"       # ISO day numbers, 1 = Monday
    maximumInterval: 365        # days
    fsrsRetention: 90           # percent
    fsrsEnableFuzzing: true

# ---------------------------------------------------------------------------
# opponents -- the training partners the review history below refers to by
# name. An opponent already known to the importing app keeps its own skill
# multiplier; someone else's opinion of an opponent does not overwrite yours.
# ---------------------------------------------------------------------------
opponents:
  - name: Alex
    skillMultiplier: 1.25
    notes: Left-handed, long reach

# ---------------------------------------------------------------------------
# cards -- the deck itself. question and answer are the only required keys.
# ---------------------------------------------------------------------------
cards:

  # The smallest card there is.
  - question: What is parry four?
    answer: A defensive blade action deflecting an attack to the high inside line.

  # A card with everything on it.
  - question: What is a riposte?

    # A multi-line answer is written as a "|-" block: the lines are kept
    # exactly, and the indentation shown here is stripped off.
    answer: |-
      An offensive action made immediately after a successful parry.
      It may be direct, or made around the opponent's blade.

    # Photographs, inline, base64-encoded -- one entry per image. (This is a
    # 1x1 PNG; a real one runs to thousands of characters on one line.)
    images:
      - iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==

    # Which groups it belongs to. Written on one line; a list under the key
    # works just as well.
    groups: [Blade Actions, Defense]

    # How the card is scheduled everywhere except in a group that learns it
    # independently. Times are milliseconds since the Unix epoch.
    state:
      nextReview: 1705593600000
      lastReview: 1705507200000
      stability: 3.1
      difficulty: 4.2
      fsrsState: LEARNING       # NEW, LEARNING, REVIEW or RELEARNING
      reps: 2
      lapses: 1
      scheduledDays: 3
      elapsedDays: 1

    # And how it is scheduled inside each group that keeps its own progress.
    # Only groups with independent learning turned on appear here.
    groupStates:
      - group: Blade Actions
        nextReview: 1705680000000
        lastReview: 1705507200000
        stability: 8.4
        difficulty: 3.9
        fsrsState: REVIEW
        reps: 6
        lapses: 0
        scheduledDays: 10
        elapsedDays: 2

# ---------------------------------------------------------------------------
# reviewHistory -- every grade ever given, when the export was asked to carry
# it. Each entry names its card by question text rather than by id, because
# ids belong to the device that made them.
# ---------------------------------------------------------------------------
reviewHistory:
  - card: What is a riposte?
    reviewTime: 1705507200000
    grade: 3                    # 0 = skipped, 1 = again, 2 = hard, 3 = good, 4 = easy
    algorithm: FSRS
    stateBefore: "S:1.0,D:4.5,ST:NEW"
    stateAfter: "S:3.1,D:4.2,ST:LEARNING"
    scheduledDays: 3
    elapsedDays: 1
    group: Blade Actions        # absent for all-cards practice
    notes: Hand was late off the parry.
    opponent: Alex
    stabilityMultiplier: 1.25
    images:
      - iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==
