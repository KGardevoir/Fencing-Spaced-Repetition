# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP registers generated sources via Kotlin sourceSets DSL, which AGP 9.0's
# built-in Kotlin disallows. Suppress until KSP ships a compatible fix.
android.disallowKotlinSourceSets=false

# AGP 9 refuses to apply com.android.library alongside the Kotlin Multiplatform
# plugin and points at com.android.kotlin.multiplatform.library instead. That
# plugin is unusable here: KSP creates no configuration for its Android target
# (google/ksp#2476), so Room generates no database for Android at all. These two
# flags are the bypass AGP itself documents in that error message.
#
# The cost is real and worth naming: builtInKotlin=false means :app applies
# org.jetbrains.kotlin.android explicitly, and newDsl=false puts both Android
# modules back on the pre-9 DSL. Both flags disappear in AGP 10, so KSP has to
# support the new plugin before this project can move past AGP 9.x.
android.builtInKotlin=false
android.newDsl=false

# The version this repository ships, in one place because two builds ship it:
# :app stamps it into the APK's manifest, and :web generates it into the
# browser bundle's About section. Held here rather than in either build file
# so the two cannot drift into disagreeing about what version the same code is.
appVersionName=1.1
appVersionCode=4
