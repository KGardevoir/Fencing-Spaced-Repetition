# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# KSP registers generated sources via Kotlin sourceSets DSL, which AGP 9.0's
# built-in Kotlin disallows. Suppress until KSP ships a compatible fix.
android.disallowKotlinSourceSets=false
# com.android.library + androidTarget() -- the only pairing KSP supports for a
# multiplatform Android target (google/ksp#2476) -- rests on AGP variant APIs
# that AGP 9 deprecated and gated behind this flag. It comes out when KSP
# supports com.android.kotlin.multiplatform.library, which has to happen before
# AGP 10 removes the APIs outright.
android.enableLegacyVariantApi=true
